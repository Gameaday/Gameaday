# Jellyfin Service
# Media streaming server with hardware acceleration (Intel QuickSync on Asus ZenBook)

version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"  # HTTPS
    volumes:
      - /volume1/media:/media
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
    # Hardware acceleration for Intel QuickSync (requires /dev/dri)
    devices:
      - "/dev/dri:/dev/dri"
    # Uncomment if using NVIDIA GPU
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility
